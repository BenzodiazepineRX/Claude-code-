AWSTemplateFormatVersion: "2010-09-09"
Description: Live Bet Tracker - private web app that reads bet slip screenshots and tracks them live.

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket holding the Lambda code zip
  CodeKey:
    Type: String
    Description: S3 key of the Lambda code zip
  ModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-6
    Description: Bedrock model (or inference profile) that reads screenshots
  FallbackModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: In-Region backup model if the first one is unavailable
  ScheduleExpression:
    Type: String
    Default: rate(2 minutes)
    Description: How often open slips are re-checked when the site is closed

Resources:
  # ------------------------------------------------------------------ data
  SlipsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: active, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: ActiveIndex
          KeySchema:
            - { AttributeName: active, KeyType: HASH }
            - { AttributeName: sk, KeyType: RANGE }
          Projection: { ProjectionType: KEYS_ONLY }
      SSESpecification: { SSEEnabled: true }

  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldScreenshots
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 180

  UploadBucketTlsOnly:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt UploadBucket.Arn, !Sub "${UploadBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # ------------------------------------------------------------------ website
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  SiteOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Live Bet Tracker
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOac.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad      # Managed-CachingDisabled (always fresh)
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # Managed-SecurityHeadersPolicy

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

  # ------------------------------------------------------------------ login
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true      # nobody can sign themselves up
        InviteMessageTemplate:
          EmailSubject: Your Bet Tracker login
          EmailMessage: !Sub "Your Bet Tracker is ready: https://${SiteDistribution.DomainName}  Username: {username}  Temporary password: {####}  (you'll pick your own password on first sign-in)"
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: hours, IdToken: hours, RefreshToken: days }

  # ------------------------------------------------------------------ backend
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties: { RetentionInDays: 14 }

  TrackerLogs:
    Type: AWS::Logs::LogGroup
    Properties: { RetentionInDays: 14 }

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId } }
      Policies:
        - PolicyName: bet-tracker
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: [!Sub "${ApiLogs.Arn}", !Sub "${TrackerLogs.Arn}"]
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:Query]
                Resource: [!GetAtt SlipsTable.Arn, !Sub "${SlipsTable.Arn}/index/ActiveIndex"]
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "${UploadBucket.Arn}/uploads/*"
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}"
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${FallbackModelId}"
                  - "arn:aws:bedrock:*::foundation-model/anthropic.*"

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Bet Tracker API
      Runtime: python3.13
      Architectures: [arm64]
      Handler: app.handler
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      MemorySize: 512
      Timeout: 29
      Role: !GetAtt FunctionRole.Arn
      LoggingConfig: { LogGroup: !Ref ApiLogs }
      Environment:
        Variables:
          TABLE_NAME: !Ref SlipsTable
          UPLOAD_BUCKET: !Ref UploadBucket
          MODEL_ID: !Ref ModelId
          FALLBACK_MODEL_ID: !Ref FallbackModelId

  TrackerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Bet Tracker live checker (runs on a schedule)
      Runtime: python3.13
      Architectures: [arm64]
      Handler: app.tracker_handler
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      MemorySize: 256
      Timeout: 120
      Role: !GetAtt FunctionRole.Arn
      LoggingConfig: { LogGroup: !Ref TrackerLogs }
      Environment:
        Variables:
          TABLE_NAME: !Ref SlipsTable
          UPLOAD_BUCKET: !Ref UploadBucket
          MODEL_ID: !Ref ModelId
          FALLBACK_MODEL_ID: !Ref FallbackModelId

  TrackerSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Re-check open bet slips
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets: [{ Id: tracker, Arn: !GetAtt TrackerFunction.Arn }]

  TrackerSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TrackerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt TrackerSchedule.Arn

  # ------------------------------------------------------------------ API
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Sub "https://${SiteDistribution.DomainName}"]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 600

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito
      AuthorizerType: JWT
      IdentitySource: [$request.header.Authorization]
      JwtConfiguration:
        Audience: [!Ref UserPoolClient]
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"

  RouteListSlips:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: GET /slips, AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${ApiIntegration}" }
  RouteCreateSlip:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: POST /slips, AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${ApiIntegration}" }
  RouteUpdateSlip:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: "PUT /slips/{id}", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${ApiIntegration}" }
  RouteDeleteSlip:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: "DELETE /slips/{id}", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${ApiIntegration}" }
  RouteParse:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: POST /parse, AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${ApiIntegration}" }
  RouteRefresh:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: POST /refresh, AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${ApiIntegration}" }
  RouteGetSettings:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: GET /settings, AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${ApiIntegration}" }
  RoutePutSettings:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: PUT /settings, AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${ApiIntegration}" }

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*"

Outputs:
  SiteUrl:
    Value: !Sub "https://${SiteDistribution.DomainName}"
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref SiteDistribution
